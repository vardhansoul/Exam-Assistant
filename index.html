
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Club of Competition</title>
    <meta name="description" content="An AI-powered application to help users prepare for competitive exams.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- Pre-connect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- Fonts with swap display for faster text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Dark Mode Initializer Script (Critical Path) -->
    <script>
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }

      // Global error handler for debugging
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('does not provide an export named')) {
          if (!sessionStorage.getItem('reloaded_for_export_error')) {
            sessionStorage.setItem('reloaded_for_export_error', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                  registration.unregister();
                }
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      });
      // Suppress unhandled promise rejection popups for background syncs
      window.addEventListener('unhandledrejection', function(e) {
         if (e.reason && typeof e.reason === 'string' && e.reason.includes('Firestore Error')) {
             e.preventDefault(); // Prevent orange/red boxes for permission denied syncing issues
         } else if (e.reason && e.reason.message && e.reason.message.includes('Firestore Error')) {
             e.preventDefault();
         }
      });
    </script>

    <!-- Tailwind handled via Vite build process -->
    <script type="module" src="/index.tsx"></script>
    <style>
      /* Keep minimal structural styles to prevent flash of unstyled content */
      html, body, #root {
        height: 100%;
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #f1f5f9;
        color: #334155;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
      }
      
      input, textarea, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }

      html.dark, html.dark body, html.dark #root {
        background-color: #0f172a;
        color: #cbd5e1;
      }

      /* Hide empty scrollbar by default */
      @media (max-width: 768px) {
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
      }
      
      @media (min-width: 769px) {
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(107, 114, 128, 0.8); }
        
        html.dark ::-webkit-scrollbar-thumb { background-color: rgba(71, 85, 105, 0.5); }
        html.dark ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.8); }
        
        * { scrollbar-width: thin; scrollbar-color: rgba(156, 163, 175, 0.5) transparent; }
        html.dark * { scrollbar-color: rgba(71, 85, 105, 0.5) transparent; }
      }
      .gpu-accelerated { transform: translateZ(0); backface-visibility: hidden; }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>
</html>
